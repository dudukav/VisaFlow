openapi: 3.0.3
info:
  title: VisaFlow API
  version: 0.2.0
  description: |
    First-MVP contract between the Telegram Mini App and the Go core. The MVP supports
    Russian residents applying for an Italian tourist visa, while resource URLs remain
    country-neutral. Document processing is asynchronous; checks after field confirmation
    are synchronous. A successful check never guarantees visa issuance.
servers:
  - {url: /api/v1, description: Same-origin API}
security:
  - sessionCookie: []
tags:
  - {name: Auth}
  - {name: Profile}
  - {name: Reference data}
  - {name: Applications}
  - {name: Access}
  - {name: Checklist}
  - {name: Documents}
  - {name: Billing}
paths:
  /auth/telegram:
    post:
      tags: [Auth]
      operationId: authenticateWithTelegram
      security: []
      requestBody: {$ref: '#/components/requestBodies/TelegramAuth'}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/session:
    delete:
      tags: [Auth]
      operationId: endSession
      responses:
        '204': {description: Session revoked and cookie expired}
  /me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      responses:
        '200': {$ref: '#/components/responses/UserProfile'}
  /consents/current:
    get:
      tags: [Profile]
      operationId: getCurrentConsent
      responses:
        '200': {$ref: '#/components/responses/Consent'}
  /consents/current/acceptance:
    put:
      tags: [Profile]
      operationId: acceptCurrentConsent
      requestBody: {$ref: '#/components/requestBodies/AcceptConsent'}
      responses:
        '200': {$ref: '#/components/responses/ConsentAcceptance'}
        '409': {$ref: '#/components/responses/Conflict'}
  /notification-preferences:
    get:
      tags: [Profile]
      operationId: getNotificationPreferences
      responses:
        '200': {$ref: '#/components/responses/NotificationPreferences'}
    patch:
      tags: [Profile]
      operationId: updateNotificationPreferences
      requestBody: {$ref: '#/components/requestBodies/UpdateNotificationPreferences'}
      responses:
        '200': {$ref: '#/components/responses/NotificationPreferences'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /application-options:
    get:
      tags: [Reference data]
      operationId: getApplicationOptions
      responses:
        '200': {$ref: '#/components/responses/ApplicationOptions'}
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/ApplicationPage'}
    post:
      tags: [Applications]
      operationId: createApplication
      requestBody: {$ref: '#/components/requestBodies/CreateApplication'}
      responses:
        '201': {$ref: '#/components/responses/Application'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /applications/{applicationId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      tags: [Applications]
      operationId: getApplication
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Applications]
      operationId: updateApplication
      description: Mutable data changes mark the checklist stale until explicit recalculation.
      requestBody: {$ref: '#/components/requestBodies/UpdateApplication'}
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Applications]
      operationId: deleteDraftApplication
      description: Only drafts can be deleted. Activated applications must be closed.
      responses:
        '204': {description: Draft deleted}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/close:
    post:
      tags: [Applications]
      operationId: closeApplication
      description: Final action; the consumed credit is not returned and personal document data is deleted after 30 days.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Application'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/applicant:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      tags: [Applications]
      operationId: getApplicant
      responses:
        '200': {$ref: '#/components/responses/Applicant'}
    patch:
      tags: [Applications]
      operationId: updateApplicant
      requestBody: {$ref: '#/components/requestBodies/UpdateApplicant'}
      responses:
        '200': {$ref: '#/components/responses/Applicant'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /applications/{applicationId}/members:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}]
    get:
      tags: [Applications]
      operationId: listMembers
      responses:
        '200': {$ref: '#/components/responses/MemberList'}
    post:
      tags: [Applications]
      operationId: createMember
      requestBody: {$ref: '#/components/requestBodies/CreateMember'}
      responses:
        '201': {$ref: '#/components/responses/Member'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /applications/{applicationId}/members/{memberId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/MemberId'}]
    patch:
      tags: [Applications]
      operationId: updateMember
      requestBody: {$ref: '#/components/requestBodies/UpdateMember'}
      responses:
        '200': {$ref: '#/components/responses/Member'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Applications]
      operationId: deleteMember
      responses:
        '204': {description: Member removed}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/members/{memberId}/invites:
    post:
      tags: [Access]
      operationId: createMemberInvite
      description: Creates a single-use short-lived Telegram Mini App deep link. Username is display-only.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/MemberId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {$ref: '#/components/responses/MemberInvite'}
        '409': {$ref: '#/components/responses/Conflict'}
  /application-invites/{inviteToken}/acceptance:
    post:
      tags: [Access]
      operationId: acceptMemberInvite
      parameters:
        - {name: inviteToken, in: path, required: true, schema: {type: string, minLength: 32, maxLength: 256}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {$ref: '#/components/responses/ApplicationAccess'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
  /applications/{applicationId}/checklist:
    get:
      tags: [Checklist]
      operationId: getChecklist
      parameters: [{$ref: '#/components/parameters/ApplicationId'}]
      responses:
        '200': {$ref: '#/components/responses/Checklist'}
        '404': {$ref: '#/components/responses/NotFound'}
  /applications/{applicationId}/checklist/recalculate:
    post:
      tags: [Checklist]
      operationId: recalculateChecklist
      description: Applies current data and latest ruleset; matching completed items are retained.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Checklist'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/checklist/items/{itemId}:
    patch:
      tags: [Checklist]
      operationId: updateChecklistItem
      description: Action items are manual; document item statuses are automatic.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/ChecklistItemId'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateChecklistItem'}
      responses:
        '200': {$ref: '#/components/responses/UpdateChecklistItemResult'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/deadlines:
    get:
      tags: [Checklist]
      operationId: listDeadlines
      parameters: [{$ref: '#/components/parameters/ApplicationId'}]
      responses:
        '200': {$ref: '#/components/responses/DeadlineList'}
  /applications/{applicationId}/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      parameters: [{$ref: '#/components/parameters/ApplicationId'}]
      responses:
        '200': {$ref: '#/components/responses/DocumentList'}
  /applications/{applicationId}/documents/upload-requests:
    post:
      tags: [Documents]
      operationId: createDocumentUploadRequest
      description: Creates a signed upload URL for one multi-page PDF of at most 15 MiB.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CreateDocumentUpload'}
      responses:
        '201': {$ref: '#/components/responses/DocumentUploadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /applications/{applicationId}/documents/{documentId}/upload-completion:
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/CompleteDocumentUpload'}
      responses:
        '202': {$ref: '#/components/responses/Document'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/documents/{documentId}:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}]
    get:
      tags: [Documents]
      operationId: getDocument
      responses:
        '200': {$ref: '#/components/responses/Document'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Documents]
      operationId: deleteDocument
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Document'}
  /applications/{applicationId}/documents/{documentId}/retry:
    post:
      tags: [Documents]
      operationId: retryDocumentProcessing
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/Document'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/documents/{documentId}/extracted-fields:
    parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}]
    get:
      tags: [Documents]
      operationId: getExtractedDocumentFields
      responses:
        '200': {$ref: '#/components/responses/ExtractedFieldsDraft'}
    put:
      tags: [Documents]
      operationId: saveExtractedDocumentFields
      description: Autosaves an incomplete draft using optimistic revision control.
      requestBody: {$ref: '#/components/requestBodies/SaveExtractedFields'}
      responses:
        '200': {$ref: '#/components/responses/ExtractedFieldsDraft'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/documents/{documentId}/extracted-fields/confirmation:
    post:
      tags: [Documents]
      operationId: confirmExtractedDocumentFields
      description: Confirms one revision and synchronously runs deterministic checks.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ConfirmExtractedFields'}
      responses:
        '200': {$ref: '#/components/responses/DocumentConfirmationResult'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /applications/{applicationId}/documents/{documentId}/checks:
    get:
      tags: [Documents]
      operationId: listDocumentChecks
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {$ref: '#/components/responses/CheckResult'}
  /applications/{applicationId}/checks:
    get:
      tags: [Documents]
      operationId: listApplicationChecks
      parameters: [{$ref: '#/components/parameters/ApplicationId'}]
      responses:
        '200': {$ref: '#/components/responses/CheckResult'}
  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      responses:
        '200': {$ref: '#/components/responses/PlanList'}
  /entitlements:
    get:
      tags: [Billing]
      operationId: listEntitlements
      responses:
        '200': {$ref: '#/components/responses/EntitlementList'}
  /applications/{applicationId}/activation-options:
    get:
      tags: [Billing]
      operationId: listApplicationActivationOptions
      description: Returns all eligible existing-credit, purchase, and single-credit upgrade alternatives.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}]
      responses:
        '200': {$ref: '#/components/responses/ActivationOptions'}
        '409': {$ref: '#/components/responses/Conflict'}
  /applications/{applicationId}/activation:
    post:
      tags: [Billing]
      operationId: activateApplication
      description: Uses a fully covering credit immediately or creates a test-payment order.
      parameters: [{$ref: '#/components/parameters/ApplicationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ActivateApplication'}
      responses:
        '200': {$ref: '#/components/responses/ActivationResult'}
        '202': {$ref: '#/components/responses/ActivationResult'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
  /orders/{orderId}:
    get:
      tags: [Billing]
      operationId: getOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses:
        '200': {$ref: '#/components/responses/Order'}
        '404': {$ref: '#/components/responses/NotFound'}
  /orders/{orderId}/test-confirmation:
    post:
      tags: [Billing]
      operationId: confirmTestOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/ActivationResult'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: visaflow_session}
  headers:
    SessionCookie:
      description: Opaque HttpOnly, Secure, SameSite=Lax session cookie
      schema: {type: string}
  parameters:
    ApplicationId: {name: applicationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    MemberId: {name: memberId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ChecklistItemId: {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    DocumentId: {name: documentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    OrderId: {name: orderId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  requestBodies:
    TelegramAuth: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TelegramAuthRequest'}}}}
    AcceptConsent: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptConsentInput'}}}}
    UpdateNotificationPreferences: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateNotificationPreferencesInput'}}}}
    CreateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationInput'}}}}
    UpdateApplication: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateApplicationInput'}}}}
    UpdateApplicant: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateApplicantInput'}}}}
    CreateMember: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateMemberInput'}}}}
    UpdateMember: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateMemberInput'}}}}
    UpdateChecklistItem: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateChecklistItemInput'}}}}
    CreateDocumentUpload: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDocumentUploadInput'}}}}
    CompleteDocumentUpload: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteDocumentUploadInput'}}}}
    SaveExtractedFields: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveExtractedFieldsInput'}}}}
    ConfirmExtractedFields: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmExtractedFieldsInput'}}}}
    ActivateApplication: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActivateApplicationInput'}}}}
  responses:
    Unauthorized: {$ref: '#/components/responses/ProblemResponse'}
    NotFound: {$ref: '#/components/responses/ProblemResponse'}
    Conflict: {$ref: '#/components/responses/ProblemResponse'}
    Gone: {$ref: '#/components/responses/ProblemResponse'}
    ValidationFailed: {description: Validation failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ValidationProblem'}}}}
    ProblemResponse: {description: Request failed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    AuthSession:
      description: Authenticated
      headers:
        Set-Cookie: {$ref: '#/components/headers/SessionCookie'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthSession'}
    UserProfile: {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/UserProfile'}}}}
    Consent: {description: Current consent, content: {application/json: {schema: {$ref: '#/components/schemas/Consent'}}}}
    ConsentAcceptance: {description: Acceptance, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentAcceptance'}}}}
    NotificationPreferences: {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPreferences'}}}}
    ApplicationOptions: {description: Allowed values, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationOptions'}}}}
    Application: {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
    ApplicationPage: {description: Application page, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationPage'}}}}
    Applicant: {description: Applicant, content: {application/json: {schema: {$ref: '#/components/schemas/Applicant'}}}}
    Member: {description: Member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
    MemberList: {description: Members, content: {application/json: {schema: {$ref: '#/components/schemas/MemberList'}}}}
    MemberInvite: {description: Invite, content: {application/json: {schema: {$ref: '#/components/schemas/MemberInvite'}}}}
    ApplicationAccess: {description: Access, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationAccess'}}}}
    Checklist: {description: Checklist, content: {application/json: {schema: {$ref: '#/components/schemas/Checklist'}}}}
    UpdateChecklistItemResult: {description: Updated item, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateChecklistItemResult'}}}}
    DeadlineList: {description: Deadlines, content: {application/json: {schema: {$ref: '#/components/schemas/DeadlineList'}}}}
    Document: {description: Document, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
    DocumentList: {description: Documents, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentList'}}}}
    DocumentUploadRequest: {description: Signed upload, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentUploadRequest'}}}}
    ExtractedFieldsDraft: {description: Editable fields, content: {application/json: {schema: {$ref: '#/components/schemas/ExtractedFieldsDraft'}}}}
    DocumentConfirmationResult: {description: Confirmed and checked, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentConfirmationResult'}}}}
    CheckResult: {description: Checks, content: {application/json: {schema: {$ref: '#/components/schemas/CheckResult'}}}}
    PlanList: {description: Plans, content: {application/json: {schema: {$ref: '#/components/schemas/PlanList'}}}}
    EntitlementList: {description: Entitlements, content: {application/json: {schema: {$ref: '#/components/schemas/EntitlementList'}}}}
    ActivationOptions: {description: Alternatives, content: {application/json: {schema: {$ref: '#/components/schemas/ActivationOptions'}}}}
    ActivationResult: {description: Activation state, content: {application/json: {schema: {$ref: '#/components/schemas/ActivationResult'}}}}
    Order: {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
  schemas:
    Uuid: {type: string, format: uuid}
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: {type: integer, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: RUB}
    TelegramAuthRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties: {initData: {type: string, minLength: 1}}
    AuthSession:
      type: object
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/UserProfile'}
        expiresAt: {type: string, format: date-time}
    UserProfile:
      type: object
      required: [id, telegramDisplayName, hasCurrentConsent]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        telegramDisplayName: {type: string}
        telegramUsername: {type: string, nullable: true, description: Display-only; never used as identity}
        hasCurrentConsent: {type: boolean}
    Consent:
      type: object
      required: [version, title, body, effectiveAt, accepted]
      properties:
        version: {type: string}
        title: {type: string}
        body: {type: string}
        effectiveAt: {type: string, format: date-time}
        accepted: {type: boolean}
        acceptedAt: {type: string, format: date-time, nullable: true}
    AcceptConsentInput:
      type: object
      additionalProperties: false
      required: [version]
      properties: {version: {type: string}}
    ConsentAcceptance:
      type: object
      required: [version, acceptedAt]
      properties:
        version: {type: string}
        acceptedAt: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      required: [deadlineRemindersEnabled, reminderOffsetsDays, timezone, updatedAt]
      properties:
        deadlineRemindersEnabled: {type: boolean}
        reminderOffsetsDays: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 30}, example: [7, 2]}
        timezone: {type: string, example: Europe/Moscow}
        updatedAt: {type: string, format: date-time}
    UpdateNotificationPreferencesInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        deadlineRemindersEnabled: {type: boolean}
        reminderOffsetsDays: {type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 30}}
        timezone: {type: string}
    Option:
      type: object
      required: [code, label]
      properties: {code: {type: string}, label: {type: string}}
    ApplicationOptions:
      type: object
      required: [countries, visaTypes, submissionCities, employmentStatuses, accessModes]
      properties:
        countries: {type: array, items: {$ref: '#/components/schemas/Option'}}
        visaTypes: {type: array, items: {$ref: '#/components/schemas/Option'}}
        submissionCities: {type: array, items: {$ref: '#/components/schemas/Option'}}
        employmentStatuses: {type: array, items: {$ref: '#/components/schemas/Option'}}
        accessModes: {type: array, items: {$ref: '#/components/schemas/Option'}}
    EmploymentStatus: {type: string, enum: [employed, self_employed, student, retired, unemployed]}
    AccessMode: {type: string, enum: [organizer_only, shared]}
    ApplicationStatus: {type: string, enum: [draft, awaiting_activation, active, upgrade_required, closed]}
    CreateApplicationInput:
      type: object
      additionalProperties: false
      required: [country, visaType, tripStartsOn, tripEndsOn, submissionCityCode, applicantDateOfBirth, employmentStatus, accessMode]
      properties:
        country: {type: string, enum: [IT]}
        visaType: {type: string, enum: [tourist]}
        tripStartsOn: {type: string, format: date}
        tripEndsOn: {type: string, format: date}
        submissionCityCode: {type: string}
        applicantDateOfBirth: {type: string, format: date}
        employmentStatus: {$ref: '#/components/schemas/EmploymentStatus'}
        accessMode: {$ref: '#/components/schemas/AccessMode'}
        organizerConsentAttested: {type: boolean, description: Required for organizer_only when other adults are added}
    UpdateApplicationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tripStartsOn: {type: string, format: date}
        tripEndsOn: {type: string, format: date}
        submissionCityCode: {type: string}
        visitDate: {type: string, format: date, nullable: true}
        accessMode: {$ref: '#/components/schemas/AccessMode'}
        organizerConsentAttested: {type: boolean}
    Application:
      allOf:
        - {$ref: '#/components/schemas/CreateApplicationInput'}
        - type: object
          required: [id, ownerId, status, participantCount, requirementsUpdateRequired, createdAt, updatedAt]
          properties:
