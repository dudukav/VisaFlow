name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend/core

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/core/go.mod
          cache-dependency-path: backend/core/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check generated OpenAPI code
        run: |
          go tool oapi-codegen \
            -config ../../api/codegen/oapi-codegen.yaml \
            ../../api/openapi.yaml
          git diff --exit-code -- internal/transport/http/generated/openapi.gen.go

      - name: Check formatting
        run: |
          unformatted_files="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "${unformatted_files}" ]; then
            echo "The following files are not formatted:"
            echo "${unformatted_files}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
